name: staging-images

on:
  workflow_dispatch:
  push:
    branches:
      - codex/tip-023a-organization-graph
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - prisma/**
      - public/**
      - scripts/build/**
      - scripts/db/**
      - src/**
      - .github/workflows/staging-images.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record bounded OIDC claims
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(jq --raw-output '.value' <<<"${response}")"
          payload="$(cut --delimiter=. --fields=2 <<<"${token}")"
          python -c 'import base64,json,sys; p=sys.stdin.read().strip(); p += "=" * (-len(p) % 4); d=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:d.get(k) for k in ("aud","sub","repository","ref","repository_owner_id","repository_id")}, sort_keys=True))' <<<"${payload}"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::217358003879:role/hiveos-staging-github-build
          aws-region: ap-southeast-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and publish migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          platforms: linux/amd64
          push: true
          build-args: VCS_REF=${{ github.sha }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/hiveos-staging-migrator:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/hiveos-staging-migrator:staging

      - name: Build and publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          build-args: VCS_REF=${{ github.sha }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/hiveos-staging-app:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/hiveos-staging-app:staging
