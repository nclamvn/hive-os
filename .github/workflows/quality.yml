name: quality-gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hiveos
          POSTGRES_PASSWORD: hiveos
          POSTGRES_DB: hiveos_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hiveos -d hiveos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Runtime connection uses the least-privileged application role; the
      # migration/owner connection is used only for migrations + role setup.
      DATABASE_URL: postgresql://hiveos_app:hiveos_app@localhost:5433/hiveos_test
      DATABASE_MIGRATION_URL: postgresql://hiveos:hiveos@localhost:5433/hiveos_test
      BETTER_AUTH_SECRET: ci-secret-at-least-16-characters
      BETTER_AUTH_URL: http://localhost:3000
      AUTH_ALLOW_SELF_SIGNUP: "true"
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: .storage-test
      DEMO_FIXTURES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy migrations (owner role)
        run: npx prisma migrate deploy

      - name: Migration status
        run: npx prisma migrate status

      - name: Configure least-privileged runtime role
        run: node scripts/db/apply-app-role.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration:strict

      - name: Build
        run: npm run build

      - name: Production startup contract
        run: npm run test:prod-startup

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Dependency policy tests (DEP-GATE)
        run: npm run test:dependency-policy

      # Full audit evidence is always generated and stored — never hidden and
      # never reduced to --omit=dev only. `|| true` lets the JSON be written even
      # though npm audit exits non-zero when advisories exist; the policy script
      # below (DEC-012), not npm's exit code, is the authoritative decision.
      - name: Dependency audit (full graph, JSON)
        run: npm audit --json > audit-full.json || true

      - name: Dependency audit (runtime+build graph, JSON)
        run: npm audit --omit=dev --json > audit-omit-dev.json || true

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            audit-full.json
            audit-omit-dev.json

      # Authoritative governed decision (DEC-012 / RISK-DEP-001). No
      # continue-on-error: a policy violation fails the job.
      - name: Dependency policy gate
        run: node scripts/ci/check-dependency-policy.mjs audit-full.json audit-omit-dev.json
